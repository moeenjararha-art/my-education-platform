<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدورات التعليمية</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
    }

    .course {
      background: white;
      padding: 25px;
      margin: 20px auto;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #ddd;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border-radius: 7px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>📚 الدورات التعليمية</h1>

  <div class="course">
    <h2>الدورة الأولى</h2>
    <p>دورة تعليمية منظمة تحتوي على مجموعة من الدروس والفيديوهات.</p>
    <a href="#" class="button">دخول إلى الدورة</a>
  </div>

  <div class="course">
    <h2>الدورة الثانية</h2>
    <p>محتوى تعليمي سيضاف قريبًا.</p>
    <a href="#" class="button">دخول إلى الدورة</a>
  </div>

</body>
</html>
