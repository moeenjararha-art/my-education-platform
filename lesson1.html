<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدرس الأول</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ddd;
    }

    .back {
      color: #2563eb;
      text-decoration: none;
      font-size: 17px;
    }

    h1 {
      text-align: center;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: black;
      margin-top: 20px;
    }

    .description {
      font-size: 18px;
      line-height: 1.8;
    }

    #message {
      text-align: center;
      margin: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="course1.html" class="back">← العودة إلى الدورة</a>

    <h1>🎥 الدرس الأول: مقدمة الدورة</h1>

    <div id="message">جاري التحقق من الدخول...</div>

    <video id="video" controls playsinline style="display:none;"></video>

    <div class="description">
      <h2>مقدمة الدورة</h2>
      <p>أهلاً بك في الدرس الأول.</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ytyucdvqgkphkfoleuqk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_GuLbzl6s862iqJ-7Ic893w_Ls19dWY9";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loadVideo() {

      const { data: { session } } =
        await supabaseClient.auth.getSession();

      if (!session) {
        document.getElementById("message").textContent =
          "يجب تسجيل الدخول لمشاهدة هذا الدرس.";
        return;
      }

      const { data, error } =
        await supabaseClient.storage
          .from("videos")
          .createSignedUrl(
            "VID-20260825-WA0001.mp4",
            3600
          );

      if (error) {
        console.error(error);
        document.getElementById("message").textContent =
          "تعذر تحميل الفيديو.";
        return;
      }

      const video = document.getElementById("video");

      video.src = data.signedUrl;
      video.style.display = "block";

      document.getElementById("message").textContent =
        "الفيديو جاهز للمشاهدة.";
    }

    loadVideo();
  </script>

</body>
</html>
