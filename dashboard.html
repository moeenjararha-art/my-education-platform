<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الطالب</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .course {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 3px 12px #ddd;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    .logout {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎓 لوحة الطالب</h1>
    <p>أهلًا بك في منصتك التعليمية.</p>

    <h2>دوراتي</h2>

    <div class="course">
      <h3>📚 الدورة الأولى</h3>
      <p>دورة تعليمية منظمة تحتوي على الدروس والفيديوهات.</p>
      <a href="course1.html" class="button">دخول إلى الدورة</a>
    </div>

    <div class="course">
      <h3>📖 الدورة الثانية</h3>
      <p>محتوى تعليمي سيضاف لاحقًا.</p>
    </div>

    <button class="logout" onclick="logout()">تسجيل الخروج</button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = supabase.createClient(
      "https://ytyucdvqgkphkfoleuqk.supabase.co",
      "sb_publishable_GuLbzl6s862iqJ-7Ic893w_Ls19dWY9"
    );

    async function checkUser() {
      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        window.location.href = "login.html";
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    }

    checkUser();
  </script>

</body>
</html>
